<style>/* Layout: Hablemos frame in teal and sand, with an athletic scoreboard type and a heart-rate line in the banner */
:root{
  --body:'Avenir Next','Avenir','Nunito Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif;--display:var(--body);--radius:16px;
  --bg:#f6f0e6;--surface:#fffdf9;--surface2:#efe7d9;--ink:#10282f;--muted:#5d7076;--line:#ebe2d3;
  --accent:#0d7c86;--accent-ink:#fff;--accent-soft:#dcf0ee;--coral:#d9643f;--sun:#9a6400;--sea:#2f6fb3;--plum:#7b4fa6;
  --hero-a:#0b3a4a;--hero-b:#0d7c86;--hero-c:#3fb4ae;--hero-ink:#fff;--hero-soft:rgba(255,255,255,.86);
  --good:#1f7a4d;--good-s:#dcf1e5;--warn:#9a6400;--warn-s:#fbf0d8;--bad:#b3261e;--bad-s:#fbe3e0;
  --shadow:0 1px 2px rgba(16,40,47,.05),0 6px 18px rgba(16,40,47,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1a20;--surface:#12262d;--surface2:#1b333b;--ink:#e8f1f2;--muted:#9db1b5;--line:#213c45;
  --accent:#4cc6c9;--accent-ink:#05252a;--accent-soft:#143a40;--coral:#f28a6c;--sun:#f2c35b;--sea:#7fb3ec;--plum:#c3a0e8;
  --hero-a:#05202a;--hero-b:#0a4f58;--hero-c:#13807f;
  --good:#6fd19d;--good-s:#17382a;--warn:#f2c35b;--warn-s:#382d12;--bad:#f08a80;--bad-s:#3d1f1c;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1a20;--surface:#12262d;--surface2:#1b333b;--ink:#e8f1f2;--muted:#9db1b5;--line:#213c45;
  --accent:#4cc6c9;--accent-ink:#05252a;--accent-soft:#143a40;--coral:#f28a6c;--sun:#f2c35b;--sea:#7fb3ec;--plum:#c3a0e8;
  --hero-a:#05202a;--hero-b:#0a4f58;--hero-c:#13807f;
  --good:#6fd19d;--good-s:#17382a;--warn:#f2c35b;--warn-s:#382d12;--bad:#f08a80;--bad-s:#3d1f1c;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}h1,h2,h3{text-wrap:balance}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
.app{display:grid;grid-template-columns:216px minmax(0,1fr);min-height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:auto}
.brand{position:relative;padding:18px 18px 22px}
.brand::after{content:'';position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--accent)}
.brand b{display:block;font:800 1.4rem/1.1 var(--display);letter-spacing:.01em;color:var(--accent)}
.brand span{font-size:.78rem;color:var(--muted)}
.tbtn{display:block;margin-top:10px;background:none;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:700;font-size:.8rem;cursor:pointer}
.nav{display:flex;flex-direction:column;gap:2px;padding:10px}
.nav a{display:flex;align-items:center;gap:10px;color:var(--muted);text-decoration:none;padding:9px 10px;border-radius:9px;font-weight:600;font-size:.95rem}
.nav a svg{width:20px;height:20px;flex:none}
.nav a:hover{background:var(--accent-soft)}
.nav a[aria-current=page]{background:var(--accent-soft);color:var(--accent)}
.sidefoot{margin-top:auto;padding:14px 18px;font-size:.75rem;color:var(--muted)}
.main{min-width:0;padding-block:20px 56px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.top{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--hero-a) 0%,var(--hero-b) 58%,var(--hero-c) 100%);color:var(--hero-ink);padding:18px 18px 20px;border-radius:var(--radius)}
.top>*{position:relative}
.top h1{font:800 clamp(1.6rem,3.5vw,2.1rem)/1.1 var(--display);letter-spacing:.005em}
.tsub{font-size:.9rem;margin-top:2px;color:var(--hero-soft)}
.top .pulse{position:absolute;right:0;top:0;bottom:0;width:min(58%,560px);height:100%;display:block;fill:none;stroke:#ff8a3d;stroke-width:3;stroke-linejoin:round;stroke-linecap:round;pointer-events:none;-webkit-mask-image:linear-gradient(to right,transparent,#000 45%);mask-image:linear-gradient(to right,transparent,#000 45%)}
.top h1,.top .tsub{position:relative;z-index:1}
.panel,.stat{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);min-width:0}
.panel{padding:18px}
.panel h2{font:700 1.1rem/1.2 var(--display);color:var(--accent);margin-bottom:8px}
.tile-c::before,.stat::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c,var(--accent))}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat{padding:12px 14px 12px 16px}
.stat b{display:block;font:700 1.85rem/1.1 var(--display);color:var(--c,var(--accent));font-variant-numeric:tabular-nums}
.stat span{font-size:.8rem;color:var(--muted)}
.c2{--c:var(--coral)}.c3{--c:var(--sun)}.c4{--c:var(--sea)}.c5{--c:var(--plum)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
.stack{display:flex;flex-direction:column;gap:10px}

    if(d<=42)return{id:'T',name:'Test prep',wk,note:'Practice on the real gear on your scheduled gear days.'}}

async function lhash(c,s){const k=await crypto.subtle.importKey('raw',lenc.encode(c),'PBKDF2',false,['deriveBits']);return lhex(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:lenc.encode(s),iterations:100000},k,256))}
function isOpen(){try{return sessionStorage.getItem(OPENKEY)==='1'}catch(e){return false}}
function getV(){try{return JSON.parse(localStorage.getItem(LOCK)||'null')}catch(e){return null}}
function tries(){try{return JSON.parse(localStorage.getItem(TRIES)||'{"n":0,"u":0}')}catch(e){return{n:0,u:0}}}
function setTries(t){try{localStorage.setItem(TRIES,JSON.stringify(t))}catch(e){}}
let started=false;
function openApp(){ui.locked=false;try{sessionStorage.setItem(OPENKEY,'1')}catch(e){}if(!started){started=true;setTab(location.hash.slice(1)||'today');boot()}else render()}
function lockScreen(){ui.locked=true;
  document.getElementById('app').innerHTML=`<main class="lockwrap"><form id="lockf" class="panel stack lockbox"><h2 style="margin:0">Field Ready</h2><p class="small muted">Enter your 6-digit passcode.</p><input id="lockc" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" aria-label="Passcode"><button class="btn primary" type="submit" style="justify-content:center">Unlock</button><p class="small" id="lockm" role="status" style="color:var(--bad);font-weight:700;min-height:1.4em"></p></form></main>`;
  const c=document.getElementById('lockc'),m=document.getElementById('lockm');c.focus();
  document.getElementById('lockf').addEventListener('submit',async e=>{e.preventDefault();e.stopPropagation();const code=c.value.replace(/\\D/g,'');c.value='';m.textContent='';
    const t=tries();if(t.u>Date.now()){m.textContent='Too many tries. Wait a moment and try again.';return}
    const v=getV();let ok=false;
    if(v){ok=await lhash(code,v.s)===v.h}
    if(!ok&&(!v||navigator.onLine)){try{const r=await fetch('/fitness/unlock',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({code})});ok=r.ok;if(r.status===429){m.textContent='Too many tries. Try again in 15 minutes.';return}if(!ok&&r.status!==401){m.textContent='The site could not check the passcode (error '+r.status+'). Try again shortly.';return}
        if(ok){const s=lhex(crypto.getRandomValues(new Uint8Array(16)));try{localStorage.setItem(LOCK,JSON.stringify({s,h:await lhash(code,s)}))}catch(x){}}}
      catch(x){if(!v){m.textContent='Connect to the internet to unlock on this device for the first time.';return}}}
    if(ok){setTries({n:0,u:0});openApp();return}
    const n=t.n+1;setTries(n>=5?{n:0,u:Date.now()+3e4}:{n,u:0});m.textContent=n>=5?'Too many tries. Wait 30 seconds and try again.':'That passcode is not right.';c.focus()});}
let hiddenAt=0;
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'){hiddenAt=Date.now()}else if(hiddenAt&&Date.now()-hiddenAt>3e5&&!ui.locked){try{sessionStorage.removeItem(OPENKEY)}catch(e){}lockScreen()}});
if(isOpen())openApp();else lockScreen();
</script>
</body></html>
