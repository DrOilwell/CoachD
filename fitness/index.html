<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Field Ready has moved</title><style>
:root{--bg:#f6f0e6;--surface:#fffdf9;--ink:#10282f;--muted:#5d7076;--line:#ebe2d3;--accent:#0d7c86;--accent-ink:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#0b1a20;--surface:#12262d;--ink:#e8f1f2;--muted:#9db1b5;--line:#213c45;--accent:#4cc6c9;--accent-ink:#05252a;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:var(--bg);color:var(--ink);font:16px/1.5 'Avenir Next','Avenir','Segoe UI',Roboto,Helvetica,Arial,sans-serif}
main{width:min(100%,380px);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:12px}h1{margin:0;font-size:1.4rem;color:var(--accent)}p{margin:0}
a,button{font:inherit;font-weight:700;padding:11px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);text-align:center;text-decoration:none;cursor:pointer}button{background:none;border:1px solid var(--line);color:inherit}
</style></head><body><main><h1>Field Ready has moved</h1><p id="t">Taking you to the new address.</p><button id="b" type="button" hidden>Save Backup File</button><a href="https://coachd.pages.dev/fitness/">Open Field Ready</a></main>
<script>
const NEW='https://coachd.pages.dev/fitness/';
(async()=>{try{if('serviceWorker'in navigator)for(const r of await navigator.serviceWorker.getRegistrations())await r.unregister();for(const k of await caches.keys())if(k.startsWith('field-ready-'))await caches.delete(k)}catch(e){}
let raw=null,d=null,last=0;try{raw=localStorage.getItem('field-ready.v1');d=raw&&JSON.parse(raw);last=+localStorage.getItem('field-ready.lastsync')||0}catch(e){}
if(!d||!d.updatedAt||d.updatedAt<=last){location.replace(NEW);return}
document.getElementById('t').textContent='This browser has entries that were not synced. Save a backup file, open the new address, then use Restore Backup in the Body tab.';
const b=document.getElementById('b');b.hidden=false;b.onclick=()=>{const u=URL.createObjectURL(new Blob([raw],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='field-ready-backup.json';document.body.appendChild(a);a.click();a.remove()}})();
</script></body></html>
